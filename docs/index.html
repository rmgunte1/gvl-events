<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>GVL Events</title>
  <meta name="theme-color" content="#0f1a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GVL Events">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="app">
    <header>
      <div class="titlebar"><h1>GVL Events</h1><button id="undo" class="undo-btn hidden">↶ Undo</button></div>
      <nav id="tabs">
        <button data-tab="new" class="active">New <span id="count-new" class="pill"></span></button>
        <button data-tab="yes">Going <span id="count-yes" class="pill"></span></button>
        <button data-tab="weekly">Weekly <span id="count-weekly" class="pill"></span></button>
      </nav>
    </header>

    <main id="main">
      <section id="login" class="hidden">
        <h2>Sign in</h2>
        <p class="muted">Private app. Use the email and password you set in Supabase.</p>
        <input id="email" type="email" placeholder="email" autocomplete="username">
        <input id="password" type="password" placeholder="password" autocomplete="current-password">
        <button id="login-btn" class="primary">Sign in</button>
        <p id="login-err" class="err"></p>
      </section>

      <section id="deck" class="hidden"></section>
      <section id="list" class="hidden"></section>
      <section id="empty" class="hidden">
        <p class="big">You're caught up.</p>
        <p class="muted">New events land every day at noon.</p>
      </section>
    </main>

    <footer id="actions" class="hidden">
      <button id="no" class="no">No</button>
      <button id="yes" class="yes">Yes</button>
    </footer>
    <div id="toast"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
