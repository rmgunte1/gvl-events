name: Daily event crawl

on:
  schedule:
    # Noon Eastern. GitHub cron is UTC and has no time zones, so we fire at both
    # 16:00 UTC (noon EDT) and 17:00 UTC (noon EST); main.py exits unless it's noon ET.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:      # "Run workflow" button for manual runs (always runs, FORCE=1)

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl, store, notify
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python main.py
